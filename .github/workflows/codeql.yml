name: CodeQL

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  analyze:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            os: ubuntu-latest
          # CodeQL analyses Swift only on macOS, and only what a build compiles.
          - language: swift
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # Keep every codeql-action step pinned to the SAME version.
      # A split fails the run with "Loaded a configuration file for version X,
      # but running version Y".
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'swift' && 'manual' || 'none' }}
      - name: Build the app (unsigned) for CodeQL
        if: matrix.language == 'swift'
        run: >-
          xcodebuild build
          -project MarketHours.xcodeproj
          -scheme MarketHours
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3

name: MarketHours
options:
  bundleIdPrefix: com.weirdapps
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  MarketHoursCore:
    path: Packages/MarketHoursCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  MarketHours:
    type: application
    platform: macOS
    sources:
      - path: MarketHours
    dependencies:
      - package: MarketHoursCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weirdapps.MarketHours
        PRODUCT_NAME: MarketHours
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_CFBundleDisplayName: Market Hours
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        CODE_SIGN_ENTITLEMENTS: MarketHours/MarketHours.entitlements
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: true
schemes:
  MarketHours:
    build:
      targets:
        MarketHours: all
    test:
      targets:
        - package: MarketHoursCore/MarketHoursCoreTests
